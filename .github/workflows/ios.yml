name: iOS

# Builds the app and the widget for the iOS simulator and runs the unit tests (SubtrackTests)
# on a macOS runner. Unsigned simulator build: no certificates or secrets are needed. UI tests
# (SubtrackUITests) are not run here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # GitHub's Xcode 27 image (arm64). Images are named after the Xcode major version.
    # The project was created with Xcode 27 (project format 90); older Xcodes cannot open it.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27
        run: |
          # The newest release; a beta only when the image has no release of Xcode 27 at all.
          XCODE=$(for x in /Applications/Xcode_27*.app; do realpath "$x"; done 2>/dev/null \
            | grep -viE 'beta|release_candidate' | sort -uV | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # The project has no shared scheme, so xcodebuild uses the one it creates per target.
      - name: List schemes
        run: xcodebuild -list -project Subtrack.xcodeproj

      # Building the app scheme also builds and embeds the widget extension.
      - name: Build app and widget for the iOS simulator
        run: |
          xcodebuild build \
            -project Subtrack.xcodeproj \
            -scheme Subtrack \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          print(best[1])
          ')
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Subtrack.xcodeproj \
            -scheme Subtrack \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SubtrackTests \
            CODE_SIGNING_ALLOWED=NO
